[project]
name = "ml-reliability-toolkit"
version = "0.1.0"
license = "MIT"
license-files = ["LICENSE"]
description = "Pre-deployment reliability checks for machine-learning systems."
readme = "README.md"
authors = [
    { name = "Meharsai26", email = "meharsai514@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.3.3",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Homepage = "https://github.com/Meharsai26/ml-reliability-toolkit"
Documentation = "https://github.com/Meharsai26/ml-reliability-toolkit#readme"
Repository = "https://github.com/Meharsai26/ml-reliability-toolkit"
Issues = "https://github.com/Meharsai26/ml-reliability-toolkit/issues"
Changelog = "https://github.com/Meharsai26/ml-reliability-toolkit/releases"

[project.optional-dependencies]
demo = [
    "scikit-learn>=1.7.2",
]

[build-system]
requires = ["uv_build>=0.7.8,<0.8"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "ml_reliability"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
